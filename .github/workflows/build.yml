name: Verified plugin bundles
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: plugin-bundles-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Download the exact released core, without rebuilding it
        run: python3 scripts/fetch_core_release.py
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Ensure generated core and JavaScript match the reviewed tree
        run: git diff --exit-code -- bin dist
      - name: Package and verify every supported desktop bundle
        run: python3 scripts/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: mygo-apple-music-release
          path: build/release/
          retention-days: 14
          if-no-files-found: error
